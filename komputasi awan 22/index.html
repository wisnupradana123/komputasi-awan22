
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Computing Mini</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      padding: 30px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 12px #0002;
    }

    h1 { color: #2563eb; }

    button {
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    li { margin: 12px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>☁️ Cloud Computing</h1>
    <p>Aplikasi penyimpanan file sederhana.</p>


    <button id="upload">Tambah File</button>

    <h3>Daftar File</h3>
    <ul id="daftar"></ul>
    <p id="status">Aplikasi siap dijalankan.</p>
  </div>

  <script>
    const input = document.getElementById("file");
    const daftar = document.getElementById("daftar");
    const status = document.getElementById("status");

    document.getElementById("upload").addEventListener("click", function () {
      const file = input.files[0];

      if (!file) {
        status.textContent = "Silakan pilih file terlebih dahulu.";
        return;
      }

      const item = document.createElement("li");
      item.textContent = file.name + " (" +
        (file.size / 1024).toFixed(2) + " KB) ";

      const hapus = document.createElement("button");
      hapus.textContent = "Hapus";

      hapus.addEventListener("click", function () {
        item.remove();
      });

      item.appendChild(hapus);
      daftar.appendChild(item);

      status.textContent = "File berhasil ditambahkan ke daftar.";
      input.value = "";
    });
  </script>
</body>
</html>
